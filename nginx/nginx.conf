worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  gzip on;
  upstream backend { server backend:8000; keepalive 16; }
  server {
    listen 8000;
    client_max_body_size 15M;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ ^/auth/(login|register|demo-login) { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { limit_req zone=api burst=50 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_send_timeout 120s; proxy_read_timeout 120s; }
  }
}
